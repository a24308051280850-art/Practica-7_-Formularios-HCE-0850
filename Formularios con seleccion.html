<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><!--Caracteres esoeciales-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title><!--Titulo de la pagina-->
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">
</head>
<body><!--Abre lo que se ve en la pagina-->
	 <h1 class="titulo-principal">Formularios con seleccion</h1>
	 <form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre"><!--Es la opcion y para seleccionar-->

<br>
Selecciona tu pais:
<select name="pais"><!--Abre para seleccionar un pais-->
<option value="1">Argentina</option><!--Es la opcion y para seleccionar-->
<option value="2">España</option><!--Es la opcion y para seleccionar-->
<option value="3">Mexico</option><!--Es la opcion y para seleccionar-->
<option value="4">Guatemala</option><!--Es la opcion y para seleccionar-->
<option value="5">Honduras</option><!--Es la opcion y para seleccionar-->
<option value="6">El Salvador</option><!--Es la opcion y para seleccionar-->
<option value="7">Venezuela</option><!--Es la opcion y para seleccionar-->
<option value="8">Colombia</option><!--Es la opcion y para seleccionar-->
</select><!--Cierra la opcion de seleccionar un pais-->
<br>
<input type="submit" value="enviar">
<input type="reset" value="borrar">
</form>
</body>
</html>
