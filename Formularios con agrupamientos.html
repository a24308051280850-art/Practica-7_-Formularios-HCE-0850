<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><!--Caracteres esoeciales-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title><!--Titulo de la pagina-->
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">
</head>
<body><!--Abre lo que se ve en la pagina-->
	 <h1 class="titulo-principal">Formularios con agrupamientos</h1>
<form action="" method="post">
<fieldset>
<legend>Datos personales</legend>
Nombre y apellido:
<input type="text" name="nombre_apellido"><br><!--Abre lo que se ve en la pagina-->
Documento valido:
<input type="file" name="documento"><br><!--Abre lo que se ve en la pagina-->
Fecha de nacimiento:

<input type="date" name="fecha_nacimiento">
</fieldset>
<fieldset>
<legend>Datos de estudio:</legend>
Nombre de la escuela:
<input type="text" name="escuela"><br><!--Para poner el nombre de la escuela-->
Certificado valido:
<input type="file" name="certificado"><br><!--Es para poner el certificado-->
Fecha de egreso:
<input type="date" name="fecha_egreso"><!--Es para poner la fecha-->
</fieldset>
<br>
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button><!--Es para el boton de enviar-->
<button type="reset">Borrar <i class="fa fa-trash"></i></button><!--Es para el botn de borrar-->
</form>
</body>
</html>
