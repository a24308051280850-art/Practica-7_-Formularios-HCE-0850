<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><!--Caracteres esoeciales-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title><!--Titulo de la pagina-->
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">
</head>
<body><!--Abre lo que se ve en la pagina-->
	 <h1 class="titulo-principal">Formularios con radiobutton</h1>
	 <form action="" method="post"><!--Abre el formulario-->
Ingresa tu nombre:
<input type="text" name="nombre"><!--Espacio para poner el nombre-->
<br>
Selecciona el maximo de estudios que tienes:
<br>
<input type="radio" name="estudios" value="1">Sin estudios <br><!--Es la opcion y para seleccionar-->
<input type="radio" name="estudios" value="2">Primaria <br><!--Es la opcion y para seleccionar-->
<input type="radio" name="estudios" value="3">Secundaria <br><!--Es la opcion y para seleccionar-->
<input type="radio" name="estudios" value="4">Preparatoria <br><!--Es la opcion y para seleccionar-->
<input type="submit" value="enviar"><!--Boton de enviar-->
<input type="reset" value="borrar"><!--Boton de borrar-->
</form>
</body>
</html>
