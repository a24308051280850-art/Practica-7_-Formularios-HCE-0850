<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><!--Caracteres esoeciales-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title><!--Titulo de la pagina-->
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">
</head>
<body><!--Abre lo que se ve en la pagina-->
	 <h1 class="titulo-principal">Formularios con limitaciones</h1>
<form action="" method="post">
Ingresa tu nombre:
<!-- Desahbilitacion de campo -->
<input type="text" name="nombre" disabled><br>
<!-- Limitacion de caracteres -->
Contraseña:
<input type="password" name="pass" maxlength="5"><br>
<!-- Solo lectura -->
Comentarios:
<textarea name="comentarios" readonly>

Este es mi comentario y no se puede borrar
</textarea><br>
</form>
</body>
</html>
