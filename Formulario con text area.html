<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><!--Caracteres esoeciales-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title><!--Titulo de la pagina-->
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">
</head>
<body><!--Abre lo que se ve en la pagina-->
	 <h1 class="titulo-principal">Formulario con text area</h1>
    <form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre"><!--Es para poner el nombre-->
<br>
Ingresa tu correo:
<input type="email" name="correo"><!--Es para el correo-->
<br>
Ingresa tus comentarios:
<textarea name="comentarios" rows="1" cols="10"></textarea><!--Para poner un comentario-->
<br>
<input type="submit" value="enviar"><!--Es el boton de enviar-->
<input type="reset" value="borrar"><!--Es el boton de borrar-->
</form>
</body><!--Cierra lo que se ve en la pagina-->
</html><!--Cierra el documento
